{{- if or .Values.rbac.helpers.enabled .Values.rbac.viewer.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cloudctl-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- if .Values.rbac.viewer.aggregateToView }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    {{- end }}
  name: {{ include "cloudctl-operator.resourceName" (dict "suffix" "appdependencies-viewer-role" "context" $) }}
rules:
- apiGroups:
  - deps.cloudctl.io
  resources:
  - appdependencies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - deps.cloudctl.io
  resources:
  - appdependencies/status
  verbs:
  - get
{{- end }}
