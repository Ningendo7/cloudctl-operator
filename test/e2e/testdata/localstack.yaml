apiVersion: v1
kind: Namespace
metadata:
  name: localstack-system
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/managed-by: cloudctl-operator-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: localstack-system
  labels:
    app: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          # Pinned by digest, matching Makefile's own LOCALSTACK_IMAGE var -
          # bump both together on a deliberate upgrade.
          image: localstack/localstack:3.8@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
          env:
            - name: SERVICES
              value: sqs,sns,s3,dynamodb,iam,sts
          ports:
            - containerPort: 4566
              name: edge
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 5
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: localstack-system
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
      name: edge
