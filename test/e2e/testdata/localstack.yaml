apiVersion: v1
kind: Namespace
metadata:
  name: localstack-system
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/managed-by: cloudctl-operator-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: localstack-system
  labels:
    app: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          # Pinned by digest, matching Makefile's own LOCALSTACK_IMAGE var -
          # bump both together on a deliberate upgrade.
          image: localstack/localstack:4.9.0@sha256:e74aa0e3dad049db6a6a86dd0d4187e054a63ec4e4273d91959b2c41093bf566
          env:
            - name: SERVICES
              # cloudwatch is required even for a CR that never declares
              # alarms: the Alarms section always calls DescribeAlarms every
              # reconcile to find and clean up previously-created alarms no
              # longer desired, the same declared-vs-ledger diff every other
              # section runs.
              value: sqs,sns,s3,dynamodb,iam,sts,cloudwatch
          ports:
            - containerPort: 4566
              name: edge
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 5
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: localstack-system
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
      name: edge
