version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - ginkgolinter
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    exhaustive:
      default-signifies-exhaustive: true
    gocyclo:
      # A function above 20 fails lint; aim for 15 in code you write or touch.
      # A //nolint:gocyclo needs a reason on the same line.
      min-complexity: 20
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
        - newexpr
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: ^api/
      - linters:
          - dupl
          - lll
        path: ^internal/
      # Ginkgo assertions with their messages run long; the suite was never
      # held to the line limit.
      - linters:
          - lll
        path: ^test/e2e/
      # The suite drives kubectl and the aws CLI by design.
      - linters:
          - gosec
        path: ^test/e2e/
        text: G204
      - linters:
          - goconst
          - unparam
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
