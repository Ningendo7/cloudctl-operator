name: Release

# Triggered by pushing a semver tag (e.g. v0.2.0), never by a branch push -
# cutting a release is a deliberate, separate action from merging to main.
# Only plain vX.Y.Z tags match: a release candidate such as v1.0.0-rc.1 is not
# a supported release (the smoke test rejects it), so it must not start one.
# The tagged commit must be on main, which the first job checks.
# After the image and chart are pushed, smoke-release.yml installs them as a
# user would; only if that passes is :latest moved and the Release created.
# Gated on every other check for this exact commit having already passed:
# wait-for-ci blocks every publish job until Lint/Tests/Integration
# Tests/Manifests Drift/Helm Chart Test/E2E Tests all report success, so a
# tag pushed against a commit that hasn't gone green on main can never
# produce a release artifact.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

env:
  IMAGE: ghcr.io/ningendo7/cloudctl-operator
  CHART_OCI: oci://ghcr.io/ningendo7/charts
  CHART_REF: ghcr.io/ningendo7/charts/cloudctl-operator

jobs:
  wait-for-ci:
    permissions:
      checks: read
      statuses: read
      contents: read
    name: Check the tag, then wait for CI on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone the code with all branches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Releases are cut from main only."
            exit 1
          fi

      - name: Wait for every other check on this commit to pass
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success
          running-workflow-name: Check the tag, then wait for CI on this commit

  build-and-push-image:
    needs: wait-for-ci
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with this workflow's own identity
    name: Build, push and sign the manager image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU/buildx for multi-platform builds
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built with provenance and an SBOM attached to the image in the registry.
      - name: Build and push the multi-platform manager image
        env:
          TAG: ${{ github.ref_name }}
        run: make docker-buildx IMG="$IMAGE:$TAG"

      - name: Read the digest that was pushed
        id: digest
        run: echo "digest=$(jq -r '."containerimage.digest"' dist/image-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the image by digest
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # The image is in the registry under this tag but nothing points at it yet
  # (:latest and the Release come after the smoke test), so a finding here
  # leaves an unreferenced tag to fix forward, as a smoke failure does. Both
  # published platforms are scanned.
  scan-image:
    needs: build-and-push-image
    permissions:
      contents: read
    name: Scan the manager image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        run: hack/install-tool.sh trivy

      - name: Fail on a fixable high or critical vulnerability
        env:
          DIGEST: ${{ needs.build-and-push-image.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            trivy image --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
              --platform "$platform" "$IMAGE@$DIGEST"
          done

  build-and-release-chart:
    needs: wait-for-ci
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with this workflow's own identity
    name: Package, push and sign the Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      chart-version: ${{ steps.version.outputs.chart_version }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned, checksum-verified Helm, not whatever the runner has.
      - name: Install Helm
        run: hack/install-tool.sh helm

      - name: Derive the chart version from the tag
        id: version
        run: |
          echo "chart_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package the chart, versioned from this tag
        env:
          VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          mkdir -p dist/chart
          helm package charts/chart \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/chart

      - name: Log in to GHCR for the OCI chart push
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      # A brand-new OCI path on GHCR (the first-ever push to this exact
      # repository, which this is) can have a brief indexing delay: Helm's
      # push does a PUT of the manifest, then an immediate GET to verify
      # it, and that GET can 404 before the registry has caught up -
      # documented upstream (helm/helm#31348) as a registry-side
      # eventual-consistency gap, not something a client-side fix can
      # avoid. Retried rather than fixed in code for the same reason this
      # operator retries AWS's own eventual-consistency errors instead of
      # treating the first failure as final.
      - name: Push the chart to GHCR as an OCI artifact
        id: push
        env:
          VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if helm push "dist/chart/cloudctl-operator-${VERSION}.tgz" "$CHART_OCI" 2>&1 | tee "$RUNNER_TEMP/push.log"; then
              digest=$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/push.log")
              if [ -z "$digest" ]; then
                echo "::error::helm push did not report a digest"
                exit 1
              fi
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "helm push attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      # cosign reads the Docker credential store, which helm's login does not write.
      - name: Log in to GHCR for signing
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the chart by digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$CHART_REF@$DIGEST"

      - name: Upload the packaged chart for the release step
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-package
          path: dist/chart/*.tgz
          retention-days: 7

  build-cli:
    needs: wait-for-ci
    permissions:
      contents: read
      id-token: write # keyless signing with this workflow's own identity
    name: Build, check and sign the CLI archives
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest Go, not go.mod's minimum: the archives embed the standard
      # library they are built with, and the minimum has known fixes missing.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Build the archives and checksums.txt
        env:
          TAG: ${{ github.ref_name }}
        run: make cli-release VERSION="$TAG"

      - name: Check the archives before signing anything
        env:
          TAG: ${{ github.ref_name }}
        run: hack/verify-cli-release.sh dist/cli "$TAG"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.0

      - name: Write an SPDX SBOM for each platform's binary
        run: |
          for stage in dist/cli/stage/*/; do
            platform=$(basename "$stage")
            syft scan "file:${stage}kubectl-appdeps" -o spdx-json="dist/cli/appdeps_${GITHUB_REF_NAME}_${platform}.spdx.json"
          done
      
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign every file that will be published
        run: |
          cd dist/cli
          for f in appdeps_*.tar.gz appdeps_*.spdx.json checksums.txt; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Upload the signed CLI files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-release
          path: |
            dist/cli/appdeps_*
            dist/cli/checksums.txt*
          retention-days: 7

  # Checks the signed files as a user would, before anything is published.
  smoke-cli:
    needs: build-cli
    permissions:
      contents: read
    name: Verify the signed CLI files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download the signed CLI files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-release
          path: dist/cli

      - name: Check the archives again
        env:
          TAG: ${{ github.ref_name }}
        run: hack/verify-cli-release.sh dist/cli "$TAG"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Verify every signature against this workflow's identity
        run: |
          cd dist/cli
          for f in appdeps_*.tar.gz appdeps_*.spdx.json checksums.txt; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done

  # Between publishing and advertising: the image and chart are in the
  # registry under this tag, but nothing points users at them yet (:latest and
  # the GitHub Release come after). A failure here leaves an unreferenced tag
  # to fix forward, not a broken release people have already pulled.
  smoke-test:
    needs: [build-and-push-image, build-and-release-chart, scan-image]
    permissions:
      contents: read
    name: Smoke-test the published artifacts
    uses: ./.github/workflows/smoke-release.yml
    with:
      version: ${{ github.ref_name }}

  alias-latest:
    needs: smoke-test
    permissions:
      contents: read
      packages: write
    name: Point :latest at this release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Alias :latest to this release's image, without rebuilding
        env:
          TAG: ${{ github.ref_name }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$TAG"

  create-release:
    needs: [smoke-test, alias-latest, smoke-cli]
    permissions:
      contents: write
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the consolidated install.yaml for this release's image tag
        env:
          TAG: ${{ github.ref_name }}
        run: make build-installer IMG="$IMAGE:$TAG"

      - name: Download the packaged chart
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart-package
          path: dist/chart

      - name: Download the signed CLI files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-release
          path: dist/cli
 
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/install.yaml
            dist/chart/*.tgz
            dist/cli/appdeps_*
            dist/cli/checksums.txt
            dist/cli/checksums.txt.sigstore.json
