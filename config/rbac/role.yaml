---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - deps.cloudctl.io
  resources:
  - appdependencies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - deps.cloudctl.io
  resources:
  - appdependencies/finalizers
  verbs:
  - update
- apiGroups:
  - deps.cloudctl.io
  resources:
  - appdependencies/status
  verbs:
  - get
  - patch
  - update
