name: Manifests Drift

# Catches two related failure modes in one job: (1) a kubebuilder marker
# (+kubebuilder:validation, +kubebuilder:rbac, ...) changed in Go source
# without make manifests/generate being re-run, so config/ and the
# generated deepcopy code are stale; (2) config/ changed (including via
# (1)) without the Helm chart being regenerated from it - the chart has no
# way to notice config/ drifted out from under it on its own. Regenerating
# both fresh and diffing against what's committed is the only way to
# actually know neither happened, rather than trusting someone remembered.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    permissions:
      contents: read
    name: Manifests drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kubebuilder
        run: hack/install-tool.sh kubebuilder

      - name: Regenerate manifests, deepcopy code, and the Helm chart
        run: make manifests generate helm-generate

      - name: Fail if regenerating changed anything
        run: |
          if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
            echo "::error::config/, generated Go code, or charts/chart/ are out of date." \
              "Run 'make manifests generate helm-generate' locally and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi
