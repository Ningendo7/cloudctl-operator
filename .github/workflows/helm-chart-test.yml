name: Helm Chart Test

# Deliberately named differently from what kubebuilder's helm/v2-alpha
# plugin scaffolds (test-chart.yml) - that file gets unconditionally
# overwritten (hardcoding a stale ./dist/chart path the plugin's own
# --output-dir flag doesn't propagate to it) every time `make helm-generate`
# runs, which would make it impossible to hand-fix and keep fixed. This
# file is untouched by that regeneration, so the fix sticks. See
# helm-generate's own Makefile comment for the other half of this.

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare cloudctl-operator
        run: |
          go mod tidy
          make docker-build
          kind load docker-image $IMG

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart
        run: |
          helm lint ./charts/chart

      - name: Render Helm Chart templates
        run: |
          helm template ./charts/chart

# TODO: Uncomment if cert-manager is enabled
