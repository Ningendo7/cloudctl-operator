name: Helm Chart Test

# Deliberately named differently from what kubebuilder's helm/v2-alpha
# plugin scaffolds (test-chart.yml) - that file gets unconditionally
# overwritten (hardcoding a stale ./dist/chart path the plugin's own
# --output-dir flag doesn't propagate to it) every time `make helm-generate`
# runs, which would make it impossible to hand-fix and keep fixed. This
# file is untouched by that regeneration, so the fix sticks. See
# helm-generate's own Makefile comment for the other half of this.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  alert-rules:
    permissions:
      contents: read
    name: Alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        run: hack/install-tool.sh helm

      - name: Install promtool
        run: hack/install-tool.sh promtool

      - name: Unit-test the alert rules the chart renders
        run: hack/test-alert-rules.sh

  helm-chart:
    permissions:
      contents: read
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: hack/install-tool.sh kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare cloudctl-operator
        run: |
          make docker-build
          kind load docker-image "$IMG"

      - name: Install Helm
        run: hack/install-tool.sh helm

      - name: Lint Helm Chart
        run: |
          helm lint ./charts/chart

      - name: Render Helm Chart templates
        run: |
          helm template ./charts/chart

      # Observability objects are opt-in: nothing that needs a CRD this
      # cluster may not have (ServiceMonitor, PrometheusRule) renders by
      # default, and nothing that can page someone turns on by accident.
      - name: Observability objects are not rendered by default
        run: |
          default=$(helm template ./charts/chart)
          for marker in "kind: ServiceMonitor" "kind: PrometheusRule" "grafana_dashboard"; do
            if grep -q "$marker" <<<"$default"; then
              echo "chart renders '$marker' by default; it must be opt-in"
              exit 1
            fi
          done

      - name: Each observability flag renders its object
        run: |
          helm template ./charts/chart --set prometheus.enabled=true | grep -q "kind: ServiceMonitor"
          helm template ./charts/chart --set prometheus.enabled=true --set prometheus.rules.enabled=true | grep -q "kind: PrometheusRule"
          helm template ./charts/chart --set grafana.dashboard.enabled=true | grep -q 'grafana_dashboard: "1"'

      - name: Pod base security groups reach the manager flag
        run: |
          helm template ./charts/chart --set manager.podBaseSecurityGroupIds='{sg-0123456789abcdef0,sg-0fedcba987654321}' \
            | grep -q -- '--pod-base-security-group-ids=sg-0123456789abcdef0,sg-0fedcba987654321'
          ! helm template ./charts/chart | grep -q -- '--pod-base-security-group-ids'

      - name: Everything enabled renders valid YAML
        run: |
          helm template ./charts/chart \
            --set prometheus.enabled=true \
            --set prometheus.rules.enabled=true \
            --set grafana.dashboard.enabled=true \
            | python3 -c 'import sys, yaml; list(yaml.safe_load_all(sys.stdin))'

      # The manager fails its own startup AWS identity check (and so never
      # becomes Ready) without something real to answer it - this cluster
      # has no AWS credentials at all otherwise. Deployed inside the kind
      # cluster itself (not as a GitHub Actions service container) so the
      # manager pod can reach it by a normal in-cluster Service DNS name,
      # without needing to bridge kind's own Docker network to the runner's.
      - name: Deploy LocalStack into the kind cluster
        run: |
          kubectl create deployment localstack --image=localstack/localstack:4.9.0@sha256:e74aa0e3dad049db6a6a86dd0d4187e054a63ec4e4273d91959b2c41093bf566
          kubectl set env deployment/localstack SERVICES=sts
          kubectl expose deployment localstack --port=4566 --target-port=4566
          kubectl rollout status deployment/localstack --timeout=120s

      - name: Deploy manager via Helm
        env:
          HELM_EXTRA_ARGS: >-
            --set manager.extraEnv[0].name=AWS_ENDPOINT_URL
            --set manager.extraEnv[0].value=http://localstack.default.svc.cluster.local:4566
            --set manager.extraEnv[1].name=AWS_ACCESS_KEY_ID
            --set manager.extraEnv[1].value=test
            --set manager.extraEnv[2].name=AWS_SECRET_ACCESS_KEY
            --set manager.extraEnv[2].value=test
            --set manager.extraEnv[3].name=AWS_REGION
            --set manager.extraEnv[3].value=us-east-1
        run: |
          make helm-deploy

      - name: Check Helm release status
        run: |
          make helm-status
