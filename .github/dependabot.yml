version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per ecosystem per week instead of one per dependency - every
    # PR triggers the full CI matrix (now 6 workflows, several of them a
    # real kind cluster), so ungrouped updates turn routine patch bumps
    # into dozens of expensive runs for no real benefit.
    # Dependabot puts each package in the first group that matches. The
    # Kubernetes libraries and controller-runtime have to move together and
    # can change behavior the envtest and e2e suites rely on, and the AWS SDK
    # is the other dependency that matters here, so each gets its own PR
    # instead of hiding inside one 20-update bump.
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      aws-sdk:
        patterns:
          - "github.com/aws/*"
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images in the Dockerfile are pinned by digest, so a moved tag or a
  # security fix reaches the repo as a PR instead of silently or never. This
  # ecosystem reads Dockerfiles only: the LocalStack image used by CI and
  # testdata is pinned by digest on purpose (see the Makefile's
  # LOCALSTACK_IMAGE comment), lives in workflow and Makefile text, and is
  # never touched here.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      base-images:
        patterns:
          - "*"
