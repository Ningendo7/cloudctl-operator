{{- with .Values.prometheus.serviceAccount }}
{{- if .name }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/name: {{ include "cloudctl-operator.name" $ }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  name: {{ include "cloudctl-operator.resourceName" (dict "suffix" "metrics-reader-prometheus" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cloudctl-operator.resourceName" (dict "suffix" "metrics-reader" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ .name }}
  namespace: {{ required "prometheus.serviceAccount.namespace is required with prometheus.serviceAccount.name" .namespace }}
{{- end }}
{{- end }}
