name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    permissions:
      contents: read
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The admission policy tests render the chart with it.
      - name: Install Helm
        run: hack/install-tool.sh helm

      - name: Running Tests
        run: make test-race

      # The live tests only run by hand against a real account, so nothing
      # else would notice one stopped compiling.
      - name: Live tests still compile
        run: go vet -tags=live ./...

  integration:
    permissions:
      contents: read
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      localstack:
        # Pinned by digest, not just the version tag - see Makefile's
        # LOCALSTACK_IMAGE comment for why. Bump both together deliberately.
        image: localstack/localstack:4.9.0@sha256:e74aa0e3dad049db6a6a86dd0d4187e054a63ec4e4273d91959b2c41093bf566
        ports:
          - 4566:4566
        env:
          SERVICES: sqs,s3,sns,dynamodb,iam,sts
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\"'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Running integration tests against LocalStack
        run: |
          go test -tags=integration ./internal/resources/sqs/... ./internal/resources/s3/... ./internal/resources/sns/... ./internal/resources/dynamodb/... ./internal/resources/iam/... -v

  cli-release:
    permissions:
      contents: read
    name: CLI Release Archives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the CLI release archives and check them
        run: |
          make cli-release VERSION=v0.0.0-ci
          hack/verify-cli-release.sh dist/cli v0.0.0-ci
