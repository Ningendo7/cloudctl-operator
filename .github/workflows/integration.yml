name: Integration Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  integration:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest

    services:
      localstack:
        # Pinned by digest, not just the version tag - see Makefile's
        # LOCALSTACK_IMAGE comment for why. Bump both together deliberately.
        image: localstack/localstack:4.9.0@sha256:e74aa0e3dad049db6a6a86dd0d4187e054a63ec4e4273d91959b2c41093bf566
        ports:
          - 4566:4566
        env:
          SERVICES: sqs,s3,sns,dynamodb
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\"'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running integration tests against LocalStack
        run: |
          go mod tidy
          go test -tags=integration ./internal/resources/sqs/... ./internal/resources/s3/... ./internal/resources/sns/... ./internal/resources/dynamodb/... -v
