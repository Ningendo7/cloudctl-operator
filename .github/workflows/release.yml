name: Release

# Triggered by pushing a semver tag (e.g. v0.2.0), never by a branch push -
# cutting a release is a deliberate, separate action from merging to main.
# Gated on every other check for this exact commit having already passed:
# wait-for-ci blocks every publish job until Lint/Tests/Integration
# Tests/Manifests Drift/Helm Chart Test/E2E Tests all report success, so a
# tag pushed against a commit that hasn't gone green on main can never
# produce a release artifact.
on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

env:
  IMAGE: ghcr.io/ningendo7/cloudctl-operator
  CHART_OCI: oci://ghcr.io/ningendo7/charts

jobs:
  wait-for-ci:
    permissions:
      checks: read
      statuses: read
      contents: read
    name: Wait for CI on this commit
    runs-on: ubuntu-latest
    steps:
      - name: Wait for every other check on this commit to pass
        uses: lewagon/wait-on-check-action@07b3e1aff439a8dcbe1df42d433fe8f3e5c1db8c # v1.9.1
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success
          running-workflow-name: Release

  build-and-push-image:
    needs: wait-for-ci
    permissions:
      contents: read
      packages: write
    name: Build and push the manager image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU/buildx for multi-platform builds
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the multi-platform manager image
        run: |
          make docker-buildx IMG=${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Alias :latest to this release's image, without rebuilding
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ github.ref_name }}

  build-and-release-chart:
    needs: wait-for-ci
    permissions:
      contents: read
      packages: write
    name: Package and push the Helm chart
    runs-on: ubuntu-latest
    outputs:
      chart-version: ${{ steps.version.outputs.chart_version }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Helm
        run: make install-helm

      - name: Derive the chart version from the tag
        id: version
        run: |
          echo "chart_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package the chart, versioned from this tag
        run: |
          mkdir -p dist/chart
          helm package charts/chart \
            --version "${{ steps.version.outputs.chart_version }}" \
            --app-version "${{ steps.version.outputs.chart_version }}" \
            --destination dist/chart

      - name: Log in to GHCR for the OCI chart push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Push the chart to GHCR as an OCI artifact
        run: |
          helm push dist/chart/cloudctl-operator-${{ steps.version.outputs.chart_version }}.tgz ${{ env.CHART_OCI }}

      - name: Upload the packaged chart for the release step
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-package
          path: dist/chart/*.tgz
          retention-days: 7

  create-release:
    needs: [build-and-push-image, build-and-release-chart]
    permissions:
      contents: write
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Build the consolidated install.yaml for this release's image tag
        run: |
          make build-installer IMG=${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Download the packaged chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart-package
          path: dist/chart

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/install.yaml
            dist/chart/*.tgz
