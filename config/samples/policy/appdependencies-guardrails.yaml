# Admission guardrails for AppDependencies, rendered from the Helm chart's
# policies (charts/chart/templates/policy) with every rule on and refusing. Do
# not edit it: change the chart, then run `make policy-sample`. Needs
# Kubernetes 1.30 or later (ValidatingAdmissionPolicy). Not part of the
# install: apply it yourself, or set policies.enabled in the chart instead.
#
# The ConfigMap holds the limits; the namespace labels each rule reads are in
# the chart's values.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cloudctl-operator-enabled-namespaces
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudctl-operator
    helm.sh/chart: cloudctl-operator-0.1.0
    app.kubernetes.io/instance: cloudctl-operator
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["deps.cloudctl.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["appdependencies"]
  matchConditions:
    - name: creates-and-spec-changes
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
  validations:
    - expression: "false"
      message: "AppDependencies are only allowed in namespaces labelled cloudctl.io/enabled=true"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cloudctl-operator-enabled-namespaces
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudctl-operator
    helm.sh/chart: cloudctl-operator-0.1.0
    app.kubernetes.io/instance: cloudctl-operator
spec:
  policyName: cloudctl-operator-enabled-namespaces
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: cloudctl.io/enabled
          operator: NotIn
          values: ["true"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cloudctl-operator-limits
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudctl-operator
    helm.sh/chart: cloudctl-operator-0.1.0
    app.kubernetes.io/instance: cloudctl-operator
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["deps.cloudctl.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["appdependencies"]
  matchConditions:
    - name: creates-and-spec-changes
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
  variables:
    - name: databases
      expression: "has(object.spec.rds) && has(object.spec.rds.resources) ? object.spec.rds.resources : []"
  validations:
    - expression: >-
        variables.databases.all(d, d.instanceClass in ["db.t4g.micro","db.t4g.small","db.t4g.medium"])
      message: "rds instanceClass must be one of db.t4g.micro, db.t4g.small, db.t4g.medium"
    - expression: >-
        variables.databases.all(d, d.allocatedStorage <= 500)
      message: "rds allocatedStorage is limited to 500 GiB"
    - expression: >-
        variables.databases.all(d, !has(d.maxAllocatedStorage) || d.maxAllocatedStorage <= 500)
      message: "rds maxAllocatedStorage is limited to 500 GiB"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cloudctl-operator-limits
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudctl-operator
    helm.sh/chart: cloudctl-operator-0.1.0
    app.kubernetes.io/instance: cloudctl-operator
spec:
  policyName: cloudctl-operator-limits
  validationActions: [Deny, Audit]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cloudctl-operator-protect-production
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudctl-operator
    helm.sh/chart: cloudctl-operator-0.1.0
    app.kubernetes.io/instance: cloudctl-operator
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["deps.cloudctl.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["appdependencies"]
  matchConditions:
    - name: creates-and-spec-changes
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
  variables:
    
    - name: sqs
      expression: "has(object.spec.sqs) && has(object.spec.sqs.resources) ? object.spec.sqs.resources : []"
    - name: sns
      expression: "has(object.spec.sns) && has(object.spec.sns.resources) ? object.spec.sns.resources : []"
    - name: s3
      expression: "has(object.spec.s3) && has(object.spec.s3.resources) ? object.spec.s3.resources : []"
    - name: dynamodb
      expression: "has(object.spec.dynamodb) && has(object.spec.dynamodb.resources) ? object.spec.dynamodb.resources : []"
    - name: rds
      expression: "has(object.spec.rds) && has(object.spec.rds.resources) ? object.spec.rds.resources : []"
    - name: kms
      expression: "has(object.spec.kms) && has(object.spec.kms.resources) ? object.spec.kms.resources : []"
  validations:
    - expression: >-
        variables.sqs.all(r, !(has(r.force) && r.force)) &&
        variables.sns.all(r, !(has(r.force) && r.force)) &&
        variables.s3.all(r, !(has(r.force) && r.force)) &&
        variables.dynamodb.all(r, !(has(r.force) && r.force))
      message: "force: true is not allowed in a production namespace"
    - expression: >-
        variables.sqs.all(r, !(has(r.deletionPolicy) && r.deletionPolicy == 'Delete')) &&
        variables.sns.all(r, !(has(r.deletionPolicy) && r.deletionPolicy == 'Delete')) &&
        variables.s3.all(r, !(has(r.deletionPolicy) && r.deletionPolicy == 'Delete')) &&
        variables.dynamodb.all(r, !(has(r.deletionPolicy) && r.deletionPolicy == 'Delete')) &&
        variables.rds.all(r, !(has(r.deletionPolicy) && r.deletionPolicy == 'Delete')) &&
        variables.kms.all(r, !(has(r.deletionPolicy) && r.deletionPolicy == 'Delete'))
      message: "deletionPolicy: Delete is not allowed in a production namespace"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cloudctl-operator-protect-production
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudctl-operator
    helm.sh/chart: cloudctl-operator-0.1.0
    app.kubernetes.io/instance: cloudctl-operator
spec:
  policyName: cloudctl-operator-protect-production
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: cloudctl.io/environment
          operator: In
          values: ["production"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cloudctl-operator-require-encryption
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudctl-operator
    helm.sh/chart: cloudctl-operator-0.1.0
    app.kubernetes.io/instance: cloudctl-operator
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["deps.cloudctl.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["appdependencies"]
  matchConditions:
    - name: creates-and-spec-changes
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
  variables:
    
    - name: sqs
      expression: "has(object.spec.sqs) && has(object.spec.sqs.resources) ? object.spec.sqs.resources : []"
    - name: sns
      expression: "has(object.spec.sns) && has(object.spec.sns.resources) ? object.spec.sns.resources : []"
    - name: s3
      expression: "has(object.spec.s3) && has(object.spec.s3.resources) ? object.spec.s3.resources : []"
    - name: dynamodb
      expression: "has(object.spec.dynamodb) && has(object.spec.dynamodb.resources) ? object.spec.dynamodb.resources : []"
    - name: rds
      expression: "has(object.spec.rds) && has(object.spec.rds.resources) ? object.spec.rds.resources : []"
    - name: kms
      expression: "has(object.spec.kms) && has(object.spec.kms.resources) ? object.spec.kms.resources : []"
  validations:
    - expression: >-
        variables.sqs.all(r, has(r.encryption) && ((has(r.encryption.enabled) && r.encryption.enabled) || (has(r.encryption.kmsKeyRef) && r.encryption.kmsKeyRef != ''))) &&
        variables.sns.all(r, has(r.encryption) && ((has(r.encryption.enabled) && r.encryption.enabled) || (has(r.encryption.kmsKeyRef) && r.encryption.kmsKeyRef != ''))) &&
        variables.s3.all(r, has(r.encryption) && ((has(r.encryption.enabled) && r.encryption.enabled) || (has(r.encryption.kmsKeyRef) && r.encryption.kmsKeyRef != ''))) &&
        variables.dynamodb.all(r, has(r.encryption) && ((has(r.encryption.enabled) && r.encryption.enabled) || (has(r.encryption.kmsKeyRef) && r.encryption.kmsKeyRef != '')))
      message: "sqs, sns, s3 and dynamodb resources must declare encryption: {enabled: true} or a kmsKeyRef"
    - expression: "variables.rds.all(r, !has(r.encryption) || has(r.encryption) && ((has(r.encryption.enabled) && r.encryption.enabled) || (has(r.encryption.kmsKeyRef) && r.encryption.kmsKeyRef != '')))"
      message: "an rds instance cannot opt out of encryption"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cloudctl-operator-require-encryption
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudctl-operator
    helm.sh/chart: cloudctl-operator-0.1.0
    app.kubernetes.io/instance: cloudctl-operator
spec:
  policyName: cloudctl-operator-require-encryption
  validationActions: [Deny, Audit]

