# Lets CRs in the checkout namespace place RDS instances in this DB subnet
# group. A platform admin creates it; the subnet group must already exist in AWS.
apiVersion: deps.cloudctl.io/v1alpha1
kind: RDSSubnetGroupGrant
metadata:
  name: prod-private-data-tier
spec:
  dbSubnetGroupName: prod-private-data-tier
  allowedNamespaces:
    - checkout
