apiVersion: deps.cloudctl.io/v1alpha1
kind: AppDependencies
metadata:
  name: e2e-orders
spec:
  sqs:
    resources:
      - name: orders
        deletionPolicy: Delete
        force: true
  sns:
    resources:
      - name: order-events
        deletionPolicy: Delete
        force: true
  dynamodb:
    resources:
      - name: sessions
        partitionKey: pk
        deletionPolicy: Delete
        force: true
  s3:
    resources:
      - name: receipts
        deletionPolicy: Delete
        force: true
