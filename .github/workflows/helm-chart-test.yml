name: Helm Chart Test

# Deliberately named differently from what kubebuilder's helm/v2-alpha
# plugin scaffolds (test-chart.yml) - that file gets unconditionally
# overwritten (hardcoding a stale ./dist/chart path the plugin's own
# --output-dir flag doesn't propagate to it) every time `make helm-generate`
# runs, which would make it impossible to hand-fix and keep fixed. This
# file is untouched by that regeneration, so the fix sticks. See
# helm-generate's own Makefile comment for the other half of this.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare cloudctl-operator
        run: |
          go mod tidy
          make docker-build
          kind load docker-image $IMG

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart
        run: |
          helm lint ./charts/chart

      - name: Render Helm Chart templates
        run: |
          helm template ./charts/chart

# TODO: Uncomment if cert-manager is enabled
#      - name: Install cert-manager via Helm (wait for readiness)
#        run: |
#          helm repo add jetstack https://charts.jetstack.io
#          helm repo update
#          helm install cert-manager jetstack/cert-manager \
#            --namespace cert-manager \
#            --create-namespace \
#            --set crds.enabled=true \
#            --wait \
#            --timeout 300s

# TODO: Uncomment if Prometheus is enabled
#      - name: Install Prometheus Operator CRDs
#        run: |
#          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#          helm repo update
#          helm install prometheus-crds prometheus-community/prometheus-operator-crds

      # The manager fails its own startup AWS identity check (and so never
      # becomes Ready) without something real to answer it - this cluster
      # has no AWS credentials at all otherwise. Deployed inside the kind
      # cluster itself (not as a GitHub Actions service container) so the
      # manager pod can reach it by a normal in-cluster Service DNS name,
      # without needing to bridge kind's own Docker network to the runner's.
      - name: Deploy LocalStack into the kind cluster
        run: |
          kubectl create deployment localstack --image=localstack/localstack:4.9.0@sha256:e74aa0e3dad049db6a6a86dd0d4187e054a63ec4e4273d91959b2c41093bf566
          kubectl set env deployment/localstack SERVICES=sts
          kubectl expose deployment localstack --port=4566 --target-port=4566
          kubectl rollout status deployment/localstack --timeout=120s

      - name: Deploy manager via Helm
        env:
          HELM_EXTRA_ARGS: >-
            --set manager.extraEnv[0].name=AWS_ENDPOINT_URL
            --set manager.extraEnv[0].value=http://localstack.default.svc.cluster.local:4566
            --set manager.extraEnv[1].name=AWS_ACCESS_KEY_ID
            --set manager.extraEnv[1].value=test
            --set manager.extraEnv[2].name=AWS_SECRET_ACCESS_KEY
            --set manager.extraEnv[2].value=test
            --set manager.extraEnv[3].name=AWS_REGION
            --set manager.extraEnv[3].value=us-east-1
        run: |
          make helm-deploy

      - name: Check Helm release status
        run: |
          make helm-status
